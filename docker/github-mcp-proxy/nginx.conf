events {
	worker_connections 768;
}
pid /var/run/nginx/nginx.pid;
http {
    server {
        listen 8080;

        location / {
            # Strip whatever Authorization header the agent sent, replace with the real PAT
            proxy_set_header Authorization "Bearer ${GITHUB_PAT}";
            proxy_pass $GITHUB_MCP_SERVICE;

            # Streamable HTTP / SSE needs these — don't let nginx buffer or timeout the stream
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
        }
    }
}
