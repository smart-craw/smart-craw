services:
  signal-cli-rest-api:
    ports: [] # no host ports needed
    networks:
      - signal-network # to access signal servers
      - signal-internal # so agent can hit this rest api
    image: bbernhard/signal-cli-rest-api:0.100-rootless
    environment:
      - MODE=json-rpc-native #supported modes: json-rpc, native, normal
    volumes:
      - "$HOME/.local/share/signal-api:/home/.local/share/signal-cli" #map "signal-cli-config" folder on host system into docker container. the folder contains the password and cryptographic keys when a new number is registered
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  squid-proxy:
    ports: [] # no host ports needed
    networks:
      - public-outbound # so this can hit host network (and internet)
      - mcp-code-signal # so code mcp for signal can hit this
      - mcp-code-agent # so code mcp for agent can hit this
      - mcp-github-proxy # so github mcp can hit this
    image: ghcr.io/smart-craw/smart-craw-web-proxy:v0.5.15

  nginx: # proxy out to LLM service
    ports: [] # no host ports needed
    image: ghcr.io/smart-craw/smart-craw-llm-proxy:v0.5.15
    networks:
      - agent-internal # reachable by (OPTIONAL) agent.  If you don't use the agent, don't use this network
      - signal-internal # reachable by signal
      - public-outbound # so this can hit host network
    environment:
      BACKEND_SERVICE: [your_openai_base_url_with_port]

  code-mcp-signal:
    networks:
      - mcp-code-signal # private only
    image: ghcr.io/danielhstahl/mcp-code-execution:v0.2.0
    user: "appuser:1500" # same group as smart-craw-signal since both read/write to the same directory
    environment:
      HTTP_PROXY: http://squid-proxy:3128
      HTTPS_PROXY: http://squid-proxy:3128
    volumes: # docker compose creates these directories if they don't exist, but possibly with wrong permissions
      # same storage location as smart-craw-signal
      - $HOME/smart-craw/storage/signal:/app/code_location

  code-mcp-agent:
    networks:
      - mcp-code-agent # private only
    image: ghcr.io/danielhstahl/mcp-code-execution:v0.2.0
    user: "appuser:1500" # same group as smart-craw-signal since both read/write to the same directory
    environment:
      HTTP_PROXY: http://squid-proxy:3128
      HTTPS_PROXY: http://squid-proxy:3128
    volumes: # docker compose creates these directories if they don't exist, but possibly with wrong permissions
      # same storage location as smart-craw-agent
      - $HOME/smart-craw/storage/agents:/app/code_location

  nginx-github: # proxy to the github mcp, adding auth header
    image: ghcr.io/smart-craw/smart-craw-github-mcp-proxy:v0.5.15
    networks:
      - mcp-github-agent # reachable by agent
      - mcp-github-proxy # reachable by mcp
    environment:
      # create a .env file with GITHUB_PAT=ghp_xxx next to docker-compose.yml
      # to authenticate to github
      # MAKE SURE THE .env FILE IS NOT IN $HOME/smart-craw/storage so agent has no access to it
      GITHUB_PAT: ${GITHUB_PAT}
      GITHUB_MCP_SERVICE: http://github-mcp-agent:8082
    depends_on:
      - github-mcp-agent

  github-mcp-agent:
    networks:
      - mcp-github-proxy # private only
    environment:
      HTTP_PROXY: http://squid-proxy:3128
      HTTPS_PROXY: http://squid-proxy:3128
    image: ghcr.io/github/github-mcp-server:v1.9.0
    command: ["http"]

  smart-craw-ui:
    ports:
      - "8080:80"
      - "8081:443"
    networks:
      - public-outbound # so this can be hit by the host network
      - agent-internal # so can hit smart-craw-agent
    image: ghcr.io/smart-craw/smart-craw-ui:v0.5.15
    environment:
      AGENT_SERVICE: http://smart-craw-agent:8000
      ALLOWED_IP_ADDRESS: [yourinternalclient]
    volumes:
      - "path/to/your/certs:/etc/nginx/certs"

  smart-craw-agent:
    networks:
      - agent-internal # isolate
      - mcp-code-agent # so agent can hit code-mcp
      - mcp-github-agent # so agent can hit github-mcp proxy
    image: ghcr.io/smart-craw/smart-craw-agent:v0.5.15
    user: "node:1500" # same group as code-mcp since both read/write to the same directory
    environment:
      LLAMA_CPP_ENDPOINT: http://nginx:8080
      MCP_SERVER_LIST: '["http://code-mcp-agent:8000/mcp", "http://nginx-github:8080/mcp"]'
    volumes: # docker compose creates these directories if they don't exist, but possibly with wrong permissions
      - "$HOME/smart-craw/storage/db:/app/db"
      - "$HOME/smart-craw/storage/agents:/app/bots"
      - "$HOME/smart-craw/storage/memory/server:/app/memory"

  smart-craw-signal:
    networks:
      - signal-internal # so agent can hit internal signal and nginx
      - mcp-code-signal # so agent can hit code-mcp
    image: ghcr.io/smart-craw/smart-craw-signal:v0.5.15
    user: "node:1500" # same group as code-mcp since both read/write to the same directory
    volumes: # docker compose creates these directories if they don't exist, but possibly with wrong permissions
      - "$HOME/smart-craw/storage/signal:/app/mounts"
      - "$HOME/smart-craw/storage/memory/signal:/app/memory"
    environment:
      LLAMA_CPP_ENDPOINT: http://nginx:8080
      SIGNAL_BOT_PHONE_NUMBER: [yourbotphonenumber]
      SIGNAL_USER_ADMIN_NUMBER: [yourrealphonenumber]
      SIGNAL_REST_ENDPOINT: http://signal-cli-rest-api:8080
      MCP_SERVER_LIST: '["http://code-mcp-signal:8000/mcp"]'
    logging:
      driver: journald # systemctl will track these logs
    depends_on:
      signal-cli-rest-api:
        condition: service_healthy

networks:
  signal-network:
    driver: bridge
  public-outbound:
    driver: bridge
  signal-internal:
    internal: true
  mcp-code-signal:
    internal: true
  agent-internal:
    internal: true
  mcp-code-agent:
    internal: true
  mcp-github-agent:
    internal: true
  mcp-github-proxy:
    internal: true
